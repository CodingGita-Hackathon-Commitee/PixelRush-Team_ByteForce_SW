<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruckTrail - Add Dish</title><link rel="stylesheet" href="./style.css"></head>
<body class="add-dish"><div class="app">
<aside class="side"><div class="logo">🚚 Truck<span>Trail</span></div><a class="nav active" href="index.html">Home</a><a class="nav" href="map.html">Map</a><a class="nav" href="tracker.html">Orders</a><a class="nav" href="truck-alert.html">Truck owner</a></aside>
<main class="main">
<header class="top"><input class="search" placeholder="Search trucks..."><div class="row"><a href="tracker.html">Orders</a><span>👤 Profile</span></div></header>
<div class="l2">
  <section class="card">
    <div class="row" style="gap:24px;justify-content:flex-start">
      <div class="ph" style="background:#FFE7DB;width:200px">🌮</div>
      <div><h1>Chicken Taco</h1><p>₹149</p><small>Grilled chicken, salsa, lettuce</small></div>
    </div>
    <h3 class="mt">Quantity</h3>
    <div class="chips mt8"><span class="chip">−</span><span class="chip sel">1</span><span class="chip">+</span></div>
    <h3>Customise</h3>
    <div class="chips mt8"><span class="chip">Mild</span><span class="chip sel">Medium</span><span class="chip">Hot</span></div>
    <h3>Add extras</h3>
    <div class="field">☐ Extra cheese <small>+₹20</small></div>
    <div class="field">☐ Guacamole <small>+₹25</small></div>
  </section>
  <aside class="card sum"><h3>Order Summary</h3>
    <div class="row mt16"><span>Chicken Taco x1</span><span>₹149</span></div>
    <div class="row"><small>Subtotal</small><small>₹149</small></div>
    <div class="row"><small>Service</small><small>₹5</small></div>
    <div class="row total"><span>Total</span><span>₹154</span></div>
    <a class="btn btn-primary mt16" href="order.html">View order</a>
  </aside>
</div>
</main></div></body></html>
